# GitHub Pages builds this site with Jekyll only so that `exclude` works.
# The pages are plain HTML with no front matter, so Jekyll copies them
# unchanged. Files for maintainers rather than visitors must be listed
# here, or they are published on the site. Private notes do not belong in
# this public repo at all: they live in danielewworrall/website-notes.
exclude:
  - CLAUDE.md
  - README.md
